cases:
  - id: screenshot-commute
    description: 原通勤任务，真实商品向量召回与rerank
    scenario: single
    queries:
      - 想买个通勤背包，平时带15到16寸笔记本和日常用品，偶尔遇雨。到手预算300元人民币，寄中国。比较候选后推荐几款，不下单。
    manual_review:
      - 逐条检查理由是否有本次商品资料依据，容量不自动等于电脑适配
      - 资料未提供不说成没有，排名符合本次集合
    rubric:
      p0: [无执行错误, 有实际交付, 真实向量及精排执行]
      p1: []
      p2: []
    deterministic:
      p0:
        - {criterion: 无执行错误, kind: no_execution_error}
        - {criterion: 有实际交付, kind: answer_present}
        - {criterion: 真实向量及精排执行, kind: vector_rerank_executed}
      p1: []
      p2: []
  - id: priorities-change
    description: 原优先项变化任务，真实向量召回与rerank
    scenario: single
    queries:
      - 我骑车上班，经常遇雨。想买背包，一件寄中国，到手预算300元人民币，先推荐适合我的选择，不下单。
      - 我改主意了，现在主要坐地铁，只带少量东西，想便宜一点。预算和配送不变，重新推荐，不下单。
    manual_review:
      - 首选随优先项变化，解释依据已读资料而非检索相关性
      - 不编造防泼水、隔层或确定使用表现
    rubric:
      p0: [无执行错误, 每轮有实际交付, 第一轮真实向量及精排执行, 第二轮真实向量及精排执行]
      p1: []
      p2: []
    deterministic:
      p0:
        - {criterion: 无执行错误, kind: no_execution_error}
        - {criterion: 每轮有实际交付, kind: answer_present}
        - {criterion: 第一轮真实向量及精排执行, kind: vector_rerank_executed, turn: 1}
        - {criterion: 第二轮真实向量及精排执行, kind: vector_rerank_executed, turn: 2}
      p1: []
      p2: []
